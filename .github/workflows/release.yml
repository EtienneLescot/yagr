name: Release

# Main pushes drive Changesets release PRs and stable publishes; next pushes publish CI-only snapshots.

on:
  push:
    branches: [ main, next ]
    paths-ignore:
      - 'docs/**'
      - 'res/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check stable release state
        run: pnpm run release:check

      - name: Build and test
        run: pnpm test

      - name: Verify package artifacts
        run: pnpm run publish:verify

      - name: Create release PR or publish packages
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release-packages
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-next:
    if: github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace dependencies
        run: pnpm run deps:check

      - name: Build and test
        run: pnpm test

      - name: Set snapshot package versions
        run: pnpm run release:snapshot:version

      - name: Verify snapshot package artifacts
        run: pnpm run publish:verify

      - name: Publish next packages
        run: pnpm run release:snapshot:publish
