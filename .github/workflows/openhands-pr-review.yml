name: OpenHands PR Review

on:
    pull_request:
        types: [opened, ready_for_review, labeled, review_requested]

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    pr-review:
        # Ne pas exécuter sur les fork PRs (pas d'accès aux secrets)
        if: |
            github.event.pull_request.head.repo.full_name == github.repository &&
            (
                (github.event.action == 'opened') ||
                github.event.action == 'ready_for_review' ||
                (github.event.action == 'labeled' && github.event.label.name == 'review-this') ||
                (
                    github.event.action == 'review_requested' &&
                    (
                        github.event.requested_reviewer.login == 'openhands-agent' ||
                        github.event.requested.reviewer.login == 'all-hands-bot'
                    )
                )
            )
        concurrency:
            group: pr-review-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        runs-on: ubuntu-24.04
        environment: prod
        steps:
            - name: Debug environment
              run: |
                  echo "LLM_MODEL: ${{ vars.OPENHANDS_LLM_MODEL }}"
                  echo "LLM_BASE_URL: ${{ vars.OPENHANDS_LLM_BASE_URL }}"
                  echo "REVIEW_STYLE: ${{ vars.OPENHANDS_REVIEW_STYLE || 'roasted' }}"
                  echo "HAS_LLM_API_KEY: ${{ secrets.LLM_API_KEY != '' }}"
                  echo "HAS_PAT_TOKEN: ${{ secrets.PAT_TOKEN != '' }}"
                  echo "HAS_LMNR_KEY: ${{ secrets.LMNR_SKILLS_API_KEY != '' }}"
            - name: Run PR Review
              uses: OpenHands/extensions/plugins/pr-review@main
              with:
                  llm-model: ${{ vars.OPENHANDS_LLM_MODEL }}
                  llm-base-url: ${{ vars.OPENHANDS_LLM_BASE_URL }}
                  review-style: ${{ vars.OPENHANDS_REVIEW_STYLE || 'roasted' }}
                  llm-api-key: ${{ secrets.LLM_API_KEY }}
                  github-token: ${{ secrets.PAT_TOKEN }}
