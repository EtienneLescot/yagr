name: OpenHands PR Review

on:
    pull_request:
        types: [opened, ready_for_review, labeled, review_requested]

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    pr-review:
        # Ne pas exécuter sur les fork PRs (pas d'accès aux secrets)
        if: |
            github.event.pull_request.head.repo.full_name == github.repository &&
            (
                (github.event.action == 'opened') ||
                github.event.action == 'ready_for_review' ||
                (github.event.action == 'labeled' && github.event.label.name == 'review-this') ||
                (
                    github.event.action == 'review_requested' &&
                    (
                        github.event.requested_reviewer.login == 'openhands-agent' ||
                        github.event.requested.reviewer.login == 'all-hands-bot'
                    )
                )
            )
        concurrency:
            group: pr-review-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        runs-on: ubuntu-24.04
        environment: prod
        steps:
            - name: Run PR Review
              uses: OpenHands/extensions/plugins/pr-review@main
              with:
                  llm-model: ${{ vars.OPENHANDS_LLM_MODEL || 'litellm_proxy/claude-sonnet-4-5-20250929' }}
                  llm-base-url: ${{ vars.OPENHANDS_LLM_BASE_URL || 'https://llm-proxy.app.all-hands.dev' }}
                  review-style: ${{ vars.OPENHANDS_REVIEW_STYLE || 'roasted' }}
                  llm-api-key: ${{ secrets.LLM_API_KEY }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  lmnr-api-key: ${{ secrets.LMNR_SKILLS_API_KEY }}
